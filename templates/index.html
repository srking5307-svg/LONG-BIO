<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SR KING • Premium Tools</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: #0a0a0f;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(168, 85, 247, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.05) 0%, transparent 70%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated gradient background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            background: linear-gradient(45deg, 
                rgba(99, 102, 241, 0.03) 0%, 
                rgba(168, 85, 247, 0.03) 25%, 
                rgba(59, 130, 246, 0.03) 50%, 
                rgba(236, 72, 153, 0.03) 75%, 
                rgba(99, 102, 241, 0.03) 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            will-change: background-position;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism card */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            will-change: transform;
            animation: cardAppear 0.6s ease-out forwards;
            opacity: 0;
        }

        .glass-card:nth-child(1) { animation-delay: 0.1s; }
        .glass-card:nth-child(2) { animation-delay: 0.2s; }
        .glass-card:nth-child(3) { animation-delay: 0.3s; }
        .glass-card:nth-child(4) { animation-delay: 0.4s; }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .glass-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.3),
                0 0 20px rgba(99, 102, 241, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        /* Shine effect on hover */
        .glass-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 30%,
                rgba(255, 255, 255, 0.05) 50%,
                transparent 70%
            );
            transform: rotate(45deg);
            transition: all 0.6s;
            pointer-events: none;
            opacity: 0;
        }

        .glass-card:hover::before {
            animation: shine 1.5s ease;
            opacity: 1;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        /* Icon animations */
        .icon-container {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            animation: iconGlow 2s ease-in-out infinite;
        }

        @keyframes iconGlow {
            0%, 100% { box-shadow: 0 0 5px rgba(99, 102, 241, 0.3); }
            50% { box-shadow: 0 0 20px rgba(99, 102, 241, 0.5); }
        }

        .icon-blue { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
        .icon-teal { background: linear-gradient(135deg, #10b981, #06b6d4); }
        .icon-amber { background: linear-gradient(135deg, #f59e0b, #ef4444); }
        .icon-pink { background: linear-gradient(135deg, #ec4899, #8b5cf6); }

        /* Input fields */
        .floating-input {
            position: relative;
            margin-bottom: 1rem;
        }

        .floating-input input, 
        .floating-input textarea {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            width: 100%;
            border-radius: 0.75rem;
            color: #f1f5f9;
            font-size: 0.9rem;
        }

        .floating-input input:focus,
        .floating-input textarea:focus {
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
            background: rgba(255, 255, 255, 0.08);
            outline: none;
        }

        .floating-input i {
            position: absolute;
            left: 0.85rem;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
            font-size: 0.9rem;
            pointer-events: none;
            transition: color 0.3s;
        }

        .floating-input input:focus + i,
        .floating-input textarea:focus + i {
            color: #6366f1;
        }

        /* Buttons */
        .btn-primary {
            background: linear-gradient(105deg, #6366f1 0%, #8b5cf6 100%);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            will-change: transform;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 30%,
                rgba(255, 255, 255, 0.2) 50%,
                transparent 70%
            );
            transform: rotate(45deg);
            transition: all 0.6s;
            pointer-events: none;
            opacity: 0;
        }

        .btn-primary:hover::after {
            animation: btnShine 1s ease;
            opacity: 1;
        }

        @keyframes btnShine {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        /* Result terminal */
        .result-terminal {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.75rem;
            margin-top: 1rem;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        /* Status badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.25rem 0.75rem;
            border-radius: 2rem;
            font-size: 0.7rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Header animation */
        .logo-icon {
            animation: logoFloat 3s ease-in-out infinite;
            will-change: transform;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* Loading spinner */
        .loading-spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            display: inline-block;
            animation: spin 0.6s linear infinite;
            margin-right: 6px;
            will-change: transform;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Channel link styles */
        .channel-link {
            color: #6366f1;
            text-decoration: none;
            transition: all 0.3s;
            position: relative;
        }

        .channel-link:hover {
            color: #8b5cf6;
            text-shadow: 0 0 10px rgba(99, 102, 241, 0.5);
        }

        /* Copy button */
        .copy-btn {
            transition: all 0.2s;
            cursor: pointer;
        }

        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fbbf24;
        }

        /* Character counter */
        .char-counter {
            font-size: 0.7rem;
            color: #9ca3af;
            margin-top: 0.25rem;
            text-align: right;
        }

        /* Mobile optimization */
        @media (max-width: 768px) {
            .glass-card {
                border-radius: 1rem;
            }
            
            .btn-primary {
                padding: 0.6rem 1rem;
                font-size: 0.9rem;
            }
            
            /* Reduce animations on mobile for better performance */
            .bg-animation {
                animation-duration: 20s;
            }
            
            .glass-card:hover {
                transform: none;
            }
        }

        /* Performance optimization */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

    <script>
        // Helper: loading state for buttons
        function setButtonLoading(btn, isLoading, originalText) {
            if (isLoading) {
                btn.disabled = true;
                btn.style.opacity = '0.7';
                btn.innerHTML = `<span class="loading-spinner"></span> ${originalText}`;
            } else {
                btn.disabled = false;
                btn.style.opacity = '1';
                btn.innerHTML = originalText;
            }
        }

        // Enhanced result display with copy & timestamp
        function showResult(element, text, isError = false) {
            element.style.display = 'block';
            const timestamp = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute:'2-digit', second:'2-digit' });
            const errorClass = isError ? 'text-red-400' : 'text-emerald-400';
            const statusText = isError ? 'FAILED' : 'SUCCESS';
            const header = `<div class="flex justify-between items-center pb-2 border-b border-gray-700 mb-2 text-xs"><span><span class="${errorClass} font-mono">[${statusText}]</span> <span class="text-gray-500">${timestamp}</span></span><button class="copy-result-btn text-gray-400 hover:text-white transition" data-clipboard="${escapeHtml(text)}"><i class="far fa-copy"></i> Copy</button></div>`;
            const content = `<pre class="whitespace-pre-wrap break-all text-gray-300 text-xs font-mono">${escapeHtml(text)}</pre>`;
            element.innerHTML = header + content;
            const copyBtn = element.querySelector('.copy-result-btn');
            if (copyBtn) {
                copyBtn.addEventListener('click', (e) => {
                    const textToCopy = copyBtn.getAttribute('data-clipboard');
                    navigator.clipboard.writeText(textToCopy);
                    const originalIcon = copyBtn.innerHTML;
                    copyBtn.innerHTML = '<i class="fas fa-check"></i> Copied!';
                    setTimeout(() => { copyBtn.innerHTML = originalIcon; }, 1500);
                });
            }
        }

        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // Character counters
        function updateCharCount(textareaId, spanId) {
            const textarea = document.getElementById(textareaId);
            const span = document.getElementById(spanId);
            if (textarea && span) {
                span.innerText = textarea.value.length;
                textarea.addEventListener('input', () => { span.innerText = textarea.value.length; });
            }
        }
        updateCharCount('guest_bio', 'guest_bio_chars');
        updateCharCount('token_bio', 'token_bio_chars');

        // Guest JWT Generator
        const genGuestBtn = document.getElementById('gen_guest_btn');
        const originalGuestText = genGuestBtn.innerHTML;

        genGuestBtn.onclick = async () => {
            const uid = document.getElementById('guest_uid').value.trim();
            const pwd = document.getElementById('guest_pwd').value.trim();
            if (!uid || !pwd) return alert('UID and password required');
            const resultDiv = document.getElementById('guest_result');
            setButtonLoading(genGuestBtn, true, originalGuestText);
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<div class="flex items-center gap-2 text-indigo-300"><i class="fas fa-circle-notch fa-spin"></i> Authenticating...</div>';
            try {
                const res = await fetch('/generate_guest', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ uid, password: pwd })
                });
                const data = await res.json();
                if (data.success) {
                    const output = `✅ JWT GENERATED\n🔑 JWT: ${data.jwt}\n👤 Nickname: ${data.nickname}\n🆔 Account ID: ${data.account_id}\n🌍 Region: ${data.region}`;
                    showResult(resultDiv, output, false);
                    document.getElementById('guest_jwt').value = data.jwt;
                } else {
                    showResult(resultDiv, `❌ Error: ${data.error}`, true);
                }
            } catch(e) { showResult(resultDiv, `❌ Request failed: ${e.message}`, true); }
            finally { setButtonLoading(genGuestBtn, false, originalGuestText); }
        };

        // Guest Bio Update
        const updateGuestBioBtn = document.getElementById('update_guest_bio_btn');
        const originalGuestBioText = updateGuestBioBtn.innerHTML;
        updateGuestBioBtn.onclick = async () => {
            const jwt = document.getElementById('guest_jwt').value.trim();
            const bio = document.getElementById('guest_bio').value.trim();
            if (!jwt || !bio) return alert('JWT and bio text required');
            const resultDiv = document.getElementById('guest_bio_result');
            setButtonLoading(updateGuestBioBtn, true, originalGuestBioText);
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<div class="flex items-center gap-2 text-cyan-300"><i class="fas fa-circle-notch fa-spin"></i> Updating bio...</div>';
            try {
                const res = await fetch('/update_bio', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ jwt, bio })
                });
                const data = await res.json();
                if (data.success) {
                    showResult(resultDiv, `✅ ${data.message}\nEndpoint used: ${data.endpoint}`, false);
                } else {
                    showResult(resultDiv, `❌ ${data.message}`, true);
                }
            } catch(e) { showResult(resultDiv, `❌ Request failed: ${e.message}`, true); }
            finally { setButtonLoading(updateGuestBioBtn, false, originalGuestBioText); }
        };

        // Access Token JWT Generation
        const genTokenBtn = document.getElementById('gen_token_btn');
        const originalTokenText = genTokenBtn.innerHTML;
        genTokenBtn.onclick = async () => {
            const token = document.getElementById('access_token').value.trim();
            if (!token) return alert('Access token required');
            const resultDiv = document.getElementById('token_result');
            setButtonLoading(genTokenBtn, true, originalTokenText);
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<div class="flex items-center gap-2 text-amber-300"><i class="fas fa-circle-notch fa-spin"></i> Fetching openID...</div>';
            try {
                const res = await fetch('/generate_token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ access_token: token })
                });
                const data = await res.json();
                if (data.success) {
                    const output = `✅ JWT GENERATED\n🔑 JWT: ${data.jwt}\n👤 Nickname: ${data.nickname}\n🆔 Account ID: ${data.account_id}\n🌍 Region: ${data.region}`;
                    showResult(resultDiv, output);
                    document.getElementById('token_jwt').value = data.jwt;
                } else {
                    showResult(resultDiv, `❌ Error: ${data.error}`, true);
                }
            } catch(e) { showResult(resultDiv, `❌ Request failed: ${e.message}`, true); }
            finally { setButtonLoading(genTokenBtn, false, originalTokenText); }
        };

        // Token Bio Update
        const updateTokenBioBtn = document.getElementById('update_token_bio_btn');
        const originalTokenBioText = updateTokenBioBtn.innerHTML;
        updateTokenBioBtn.onclick = async () => {
            const jwt = document.getElementById('token_jwt').value.trim();
            const bio = document.getElementById('token_bio').value.trim();
            if (!jwt || !bio) return alert('JWT and bio text required');
            const resultDiv = document.getElementById('token_bio_result');
            setButtonLoading(updateTokenBioBtn, true, originalTokenBioText);
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<div class="flex items-center gap-2 text-pink-300"><i class="fas fa-circle-notch fa-spin"></i> Submitting bio update...</div>';
            try {
                const res = await fetch('/update_bio', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ jwt, bio })
                });
                const data = await res.json();
                if (data.success) {
                    showResult(resultDiv, `✅ ${data.message}\nEndpoint used: ${data.endpoint}`, false);
                } else {
                    showResult(resultDiv, `❌ ${data.message}`, true);
                }
            } catch(e) { showResult(resultDiv, `❌ Request failed: ${e.message}`, true); }
            finally { setButtonLoading(updateTokenBioBtn, false, originalTokenBioText); }
        };
    </script>
</body>
</html>
